<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyMate AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="topbar"><div class="topbar__inner"><div class="brand"><span class="brand__mark">SM</span><div class="brand__text"><span class="brand__name">StudyMate <em>AI</em></span><span class="brand__tagline">Your AI-powered study companion</span></div></div></div></header><main class="page"><section class="hero" id="hero"><p class="hero__eyebrow">Five tools. One desk.</p><h1 class="hero__title">Study smarter <span class="hl">with AI</span></h1><p class="hero__subtitle">Understand, practice, and ask questions from your notes.</p><div class="mode-grid" id="modeGrid"><button class="mode-card" data-mode="summarize" data-title="Summarize Notes" data-icon="📝" data-desc="Turn long notes into a clean, structured summary."><span class="mode-card__index">01</span><span class="mode-card__icon">📝</span><span class="mode-card__title">Summarize Notes</span><span class="mode-card__desc">Turn long notes into a clean, structured summary.</span></button><button class="mode-card" data-mode="explain" data-title="Explain Concept" data-icon="💡" data-desc="Get a plain-language walkthrough of any topic."><span class="mode-card__index">02</span><span class="mode-card__icon">💡</span><span class="mode-card__title">Explain Concept</span><span class="mode-card__desc">Get a plain-language walkthrough of any topic.</span></button><button class="mode-card" data-mode="improve" data-title="Improve Answer" data-icon="✍️" data-desc="Sharpen a written answer before you submit it."><span class="mode-card__index">03</span><span class="mode-card__icon">✍️</span><span class="mode-card__title">Improve Answer</span><span class="mode-card__desc">Sharpen a written answer before you submit it.</span></button><button class="mode-card" data-mode="quiz" data-title="Generate Quiz" data-icon="❓" data-desc="Turn study notes into an interactive quiz."><span class="mode-card__index">04</span><span class="mode-card__icon">❓</span><span class="mode-card__title">Generate Quiz</span><span class="mode-card__desc">Practice with a custom quiz.</span></button><button class="mode-card" data-mode="rag" data-title="Ask My Notes" data-icon="📚" data-desc="Ask questions grounded in a PDF or TXT file."><span class="mode-card__index">05</span><span class="mode-card__icon">📚</span><span class="mode-card__title">Ask My Notes</span><span class="mode-card__desc">Get answers based on your uploads.</span></button></div></section><section class="workspace" id="workspace" hidden><div class="workspace__card"><button class="workspace__back" id="backBtn">← Back</button><div class="workspace__head"><span class="workspace__icon" id="wsIcon">📝</span><div><h2 class="workspace__title" id="wsTitle"></h2><p class="workspace__desc" id="wsDesc"></p></div></div><div id="standardPanel"><label class="field-label">Your content</label><textarea id="contentInput" class="content-input" rows="10" maxlength="6000"></textarea><div class="field-meta"><span id="inputError" class="field-error"></span><span id="charCount" class="char-count">0 / 6000</span></div><div class="workspace__actions"><button id="clearBtn" class="btn btn--ghost">Clear</button><button id="generateBtn" class="btn btn--primary">Generate</button></div></div><div id="quizPanel" hidden><label class="field-label">Study notes</label><textarea id="quizContent" class="content-input" rows="9" maxlength="6000"></textarea><div class="quiz-controls"><label>Questions <select id="quizCount"><option>5</option><option>10</option><option>15</option></select></label><label>Difficulty <select id="quizDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label></div><div class="workspace__actions"><button id="newQuizBtn" class="btn btn--ghost">Clear</button><button id="quizBtn" class="btn btn--primary">Generate Quiz</button></div></div><div id="ragPanel" hidden><label class="field-label">Study file (PDF or TXT, max 10 MB)</label><input id="studyFile" class="file-input" type="file" accept=".pdf,.txt"><div class="workspace__actions"><button id="uploadBtn" class="btn btn--primary">Upload Notes</button></div><p id="uploadStatus" class="upload-status"></p><label class="field-label">Your question</label><textarea id="ragQuestion" class="content-input" rows="4" maxlength="1500"></textarea><div class="workspace__actions"><button id="askBtn" class="btn btn--primary">Ask Question</button></div></div></div><div class="workspace__card result-card" id="resultCard" hidden><div class="result-card__head"><h3>AI Response</h3><button id="copyBtn" class="btn btn--small">Copy Response</button></div><div id="resultContent" class="result-content"></div></div><div class="workspace__card result-card" id="quizCard" hidden><div class="result-card__head"><h3>Your Quiz</h3><button id="generateNewQuizBtn" class="btn btn--small">Generate New Quiz</button></div><form id="quizForm"></form><button id="submitQuizBtn" class="btn btn--primary">Submit Quiz</button><div id="quizScore" class="quiz-score" hidden></div></div><div class="workspace__card result-card" id="ragResultCard" hidden><h3>Answer from your notes</h3><div id="ragAnswer" class="result-content"></div><div id="ragSources" class="sources"></div></div><div class="workspace__card error-card" id="errorCard" hidden><p id="errorText"></p></div></section></main><script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
